name: Florest PDV Windows
on:
  push:
    branches: [florest-pdv-windows]
    paths: ['florest-pdv-windows/**', '.github/workflows/florest-pdv-windows.yml']
permissions:
  contents: write
concurrency:
  group: pdv-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: florest-pdv-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: florest-pdv-windows/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:manual
      - name: Conferir busca, quantidade e atalhos na interface
        shell: pwsh
        run: |
          $uiRuntime = Join-Path $env:RUNNER_TEMP 'florest-pdv-ui'
          npm install --prefix "$uiRuntime" --no-save --package-lock=false playwright@1.58.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FLOREST_UI_PLAYWRIGHT = Join-Path $uiRuntime 'node_modules/playwright'
          node scripts/ui-keyboard-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ui-taxas-web.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Conferir abertura do aplicativo empacotado
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/win-unpacked/Florest PDV.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Falha no aplicativo: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Florest-PDV-Windows
          path: |
            florest-pdv-windows/dist/*.exe
            florest-pdv-windows/dist/Manual-Florest-PDV.html
          if-no-files-found: error
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = `pdv-windows-teste-${context.runNumber}`;
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: `Florest PDV Windows — teste ${context.runNumber}`, prerelease: true,
              body: 'Versão 0.2.2: controle opcional de taxas por empresa, recebido do Financeiro do ERP, bandeiras no débito/crédito à vista e snapshot na fila offline. Use Receber atualizações após configurar. Florest PDV Windows: busca enquanto digita, seleção com setas e Enter, quantidade e atalhos F4 Dinheiro, F6 Pix, F7 Débito, F8 Crédito. Mantém F2 Cliente, F3 Finalizar, F5 Desconto e F9 Buscar. F1 abre o manual; a opção Outros foi removida. Instale por cima da versão anterior para manter os dados locais. O primeiro acesso e a abertura/fechamento de caixa precisam de conexão. Não emite documento fiscal. Inclui manual HTML para consulta offline e impressão.'
            });
            for (const name of fs.readdirSync('florest-pdv-windows/dist').filter(n => n.endsWith('.exe') || n === 'Manual-Florest-PDV.html')) {
              const file = path.join('florest-pdv-windows/dist', name);
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.data.id, name, data: fs.readFileSync(file)});
            }
