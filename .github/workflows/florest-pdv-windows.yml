name: Florest PDV Windows
on:
  push:
    branches: [florest-pdv-windows]
    paths: ['florest-pdv-windows/**', '.github/workflows/florest-pdv-windows.yml']
permissions:
  contents: write
concurrency:
  group: pdv-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: florest-pdv-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: florest-pdv-windows/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm test
      - run: npm run build:manual
      - name: Conferir busca, quantidade e atalhos na interface
        shell: pwsh
        run: |
          $uiRuntime = Join-Path $env:RUNNER_TEMP 'florest-pdv-ui'
          npm install --prefix "$uiRuntime" --no-save --package-lock=false playwright@1.58.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FLOREST_UI_PLAYWRIGHT = Join-Path $uiRuntime 'node_modules/playwright'
          node scripts/ui-keyboard-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ui-history.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ui-danfe.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ui-taxas-web.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Conferir abertura do aplicativo empacotado
        shell: pwsh
        run: |
          $process = Start-Process -WindowStyle Hidden -FilePath './dist/win-unpacked/Florest PDV.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Falha no aplicativo: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Florest-PDV-Windows
          path: |
            florest-pdv-windows/dist/*.exe
            florest-pdv-windows/dist/Manual-Florest-PDV.html
          if-no-files-found: error
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = JSON.parse(fs.readFileSync('florest-pdv-windows/package.json')).version;
            const tag = `pdv-windows-${version}`;
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: `Florest PDV Windows ${version} — testes`, prerelease: true,
              body: 'Versão 0.3.0 para validação: fluxo fiscal online pelo ERP, número remoto preservado, atualização com validação de checksum e backup SQLite, caixa e proteção do cupom durante sincronização. Ainda exige validação integrada com conta de testes e impressora. Instale por cima para preservar os dados.'
            });
            for (const name of fs.readdirSync('florest-pdv-windows/dist').filter(n => n.endsWith('.exe') || n.endsWith('.blockmap') || n === 'latest.yml' || n === 'Manual-Florest-PDV.html')) {
              const file = path.join('florest-pdv-windows/dist', name);
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.data.id, name, data: fs.readFileSync(file)});
            }
